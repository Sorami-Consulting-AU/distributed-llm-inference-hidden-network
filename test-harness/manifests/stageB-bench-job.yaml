# Baseline (un-hardened) in-cluster benchmark client. Runs from the neighbor
# namespace so the measured path is the same cross-namespace pod-to-pod path an
# attacker or a real caller would take; Stage D layers are compared against it.
# The ConfigMap `sorami-lab-bench` is created from bench/bench.py by
# scripts/stageB-bench.sh so the client is byte-identical across stages.
apiVersion: batch/v1
kind: Job
metadata:
  name: sorami-lab-bench-baseline
  namespace: sorami-lab-neighbor
  labels:
    research: sorami-lab
    stage: b-baseline
spec:
  backoffLimit: 0
  # Keeps the finished pod around long enough to pull logs, then self-cleans.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        research: sorami-lab
        app: bench
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bench
          image: python:3.12-slim
          env:
            - name: BASE
              value: http://sorami-lab-vllm-engine.sorami-lab-stack-vllm.svc.cluster.local:8000
            - name: "N"
              value: "128"
          # Each level prints one JSON line tagged RESULT so the runner can
          # split results out of the pod log without a shared volume.
          command:
            - sh
            - -c
            - |
              set -e
              python /bench/bench.py "$BASE" 1 8 /tmp/warmup.json >/dev/null
              for c in 1 4 16 32; do
                python /bench/bench.py "$BASE" $c $N /tmp/c$c.json >/dev/null
                printf 'RESULT c=%s ' $c; python -c "import json;print(json.dumps(json.load(open('/tmp/c$c.json'))['summary']))"
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { cpu: "2", memory: 512Mi }
          volumeMounts:
            - { name: bench, mountPath: /bench }
      volumes:
        - name: bench
          configMap: { name: sorami-lab-bench }
